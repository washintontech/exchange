# Initiator (for sending execution acks to brokers)
[SESSION]
BeginString = FIX.4.4
SenderCompID = EXCHANGE
TargetCompID = BROKER
SocketConnectHost = broker-host  # Broker's IP/hostname
SocketConnectPort = 9877         # Broker's acceptor port
SocketUseOnload = true
HeartBtInt = 30




;[DEFAULT]
;ConnectionType = acceptor
;HeartBtInt = 30
;StartTime = 00:00:00
;EndTime = 23:59:59
;
;# Listening port for broker connections
;SocketAcceptPort = 9876
;
;# Storage and logs
;FileStorePath = target/fix/exchange/store
;FileLogPath = target/fix/exchange/log
;
;UseDataDictionary = Y
;DataDictionary = FIX44.xml
;
;# Optional enhancements
;ResetOnLogon = Y
;SocketNodelay = Y
;
;[SESSION]
;BeginString = FIX.4.4
;SenderCompID = EXCHANGE
;TargetCompID = BROKER